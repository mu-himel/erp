spring.application.name=ERP SCM

server.port=8085
app.version=@project.version@
# DB Connection Configuration
keycloak.url=http://keycloak.cloudaes.com/keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.url}/realms/aesl
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs


spring.datasource.url=jdbc:mysql://a3832c67b2a874061ad2077f1022b976-825610644.ap-south-1.elb.amazonaws.com:3307/erpscmdb?useUnicode=yes&characterEncoding=UTF-8&characterSetResults=UTF-8
spring.datasource.username=erpscmDb_user
spring.datasource.password=erpscmDb_1234


spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQL8Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hikari Configuration
spring.datasource.hikari.minimumIdle=1
spring.datasource.hikari.maximumPoolSize=15
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.poolName=SpringBootJPAHikariCP
spring.datasource.hikari.maxLifetime=2000000
spring.datasource.hikari.connectionTimeout=30000

logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.file.name=./log/app-log.log
spring.output.ansi.enabled=ALWAYS

#file config
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
server.tomcat.max-http-form-post-size=10485760
